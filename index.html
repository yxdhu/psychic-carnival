<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">

<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--ac:#e8590c;--acx:#fff;--bd:#e3e6eb;--ok:#2f9e44;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b22;--tx:#eef0f4;--mut:#98a0ae;--bd:#2a2e38}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b22;--tx:#eef0f4;--mut:#98a0ae;--bd:#2a2e38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tab{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px}
.tab.on{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.nav{display:flex;gap:8px;margin:6px 0 12px}
.nav button{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:16px}
.hint{font-size:13px;color:var(--mut);margin-bottom:8px}
.hint b{color:var(--ok)}
.row{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.row span{color:var(--mut);font-size:13px}
.imgs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 8px}.imgs img{height:150px;width:auto;flex:0 0 auto;border-radius:10px;background:#fff;border:1px solid var(--bd)}
textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px;margin-bottom:8px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lb{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:600}
.add{width:100%;margin-top:2px;font-size:14px;color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.tbl th{color:var(--mut);font-weight:500}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.bar div{max-width:640px;margin:0 auto;display:flex;gap:8px}
.bar button{flex:1}
.tog{display:flex;gap:6px;margin-bottom:10px}
.tog .tab{flex:1;text-align:center}
</style>
</head>
<body>
<main>
<h1>Fitness Tracker</h1>
<div class="tog"><button class="tab on" id="vT">Workout</button><button class="tab" id="vD">Daily</button><button class="tab" id="vH">Progress</button></div>
<div id="app"></div>
</main>

const TOP=11, STEP=2.5, KEY="fitness-tracker-v1";
let S={sessions:[],draft:{},day:0,notes:{},daily:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.notes=S.notes||{};S.daily=S.daily||{};
let view="t";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function last(ex){for(let i=S.sessions.length-1;i>=0;i--){const s=S.sessions[i].e[ex];if(s&&s.length)return s}return null}
function hint(ex){
  const l=last(ex);if(!l)return "First time — pick a weight you can do for 11 reps.";
  const w=Math.max(...l.map(x=>x[0]));
  const txt="Last: "+l.map(x=>x[0]+"×"+x[1]).join(", ");
  const done=l.every(x=>x[1]>=TOP);
  return txt+(done?` — <b>try ${w+STEP} kg today</b>`:` — aim for ${TOP} reps on all sets at ${w} kg`);
}
function sets(day,ex){const d=S.draft[day]=S.draft[day]||{};return d[ex]=d[ex]||[["",11],["",11],["",11]]}

function renderT(){
  const d=S.day,p=PLAN[d];
  let h='<div class="tabs">'+PLAN.map((x,i)=>`<button class="tab ${i===d?"on":""}" data-d="${i}">Day ${i+1} · ${x.n}</button>`).join("")+'</div>';
  p.ex.forEach((ex,ei)=>{
    const st=sets(d,ex),l=last(ex);
    h+=`<div class="card"><h3>${esc(ex)}</h3><div class="hint">${hint(ex)}</div>`;
    if(IMGS[ex])h+=`<div class="imgs">${IMGS[ex].map(u=>`<img src="${u}" alt="${esc(ex)}" loading="lazy">`).join("")}</div>`;
    h+=`<textarea rows="2" placeholder="Seat / machine settings (e.g. seat 4, back pad 3)" data-n="${ei}">${esc(S.notes[ex]||"")}</textarea>`;
    st.forEach((s,si)=>{
      const pw=l&&l[si]?l[si][0]:"kg",pr=l&&l[si]?l[si][1]:"reps";
      h+=`<div class="row"><span>${si+1}</span><input inputmode="decimal" placeholder="${pw}" value="${s[0]}" data-e="${ei}" data-s="${si}" data-f="0"><input inputmode="numeric" placeholder="${pr}" value="${s[1]}" data-e="${ei}" data-s="${si}" data-f="1"></div>`;
    });
    h+=`<button class="add" data-add="${ei}">+ Add set</button></div>`;
  });
  h+='<div class="bar"><div><button id="clr">Clear</button><button class="pri" id="fin">Finish workout</button></div></div>';
  $("app").innerHTML=h;
}
function renderH(){
  const all={};S.sessions.forEach(s=>Object.entries(s.e).forEach(([k,v])=>{(all[k]=all[k]||[]).push([s.date,v])}));
  let h='';
  if(!S.sessions.length)h='<div class="card hint">No workouts saved yet. Log sets and tap Finish workout.</div>';
  else{
    h+='<div class="card"><h3>Best weights</h3><table class="tbl"><tr><th>Exercise</th><th>Best</th><th>Latest</th></tr>';
    Object.keys(all).sort().forEach(k=>{
      const ws=all[k].map(x=>Math.max(...x[1].map(y=>y[0])));
      h+=`<tr><td>${esc(k)}</td><td>${Math.max(...ws)} kg</td><td>${ws[ws.length-1]} kg</td></tr>`;
    });
    h+='</table></div><div class="card"><h3>History</h3><table class="tbl">';
    S.sessions.slice().reverse().slice(0,30).forEach(s=>{
      const vol=Object.values(s.e).flat().reduce((a,x)=>a+x[0]*x[1],0);
      h+=`<tr><td>${s.date}</td><td>${esc(s.n)}</td><td>${Math.round(vol)} kg vol</td></tr>`;
    });
    h+='</table></div><button class="add" id="exp">Copy data (JSON)</button>';
  }
  $("app").innerHTML=h;
}
const DAILY=[{n:"Sit-ups",u:"reps"},{n:"Pull-ups",u:"reps",as:1},{n:"Push-ups",u:"reps"},{n:"Hanging leg raises",u:"reps"},{n:"Plank",u:"min"},{n:"Dips",u:"reps",as:1}];
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=(x,e)=>x.v+" "+e.u+(e.as&&x.a!==undefined&&x.a!==""?" · "+x.a+" kg assist":"");
function lastDaily(k){const ds=Object.keys(S.daily).filter(d=>d<today()&&S.daily[d][k]&&S.daily[d][k].v).sort();if(!ds.length)return null;const d=ds[ds.length-1];return [d,S.daily[d][k]]}
function renderD(){
  const t=today(),cur=S.daily[t]||{};
  let h=`<div class="hint">Today · ${t}</div>`;
  DAILY.forEach((e,i)=>{
    const c=cur[e.n]||{},l=lastDaily(e.n),min=e.u==="min";
    h+=`<div class="card"><h3>${e.n}</h3><div class="hint">${l?"Last ("+l[0]+"): "+fmt(l[1],e):"No entries yet"}</div><div class="${e.as?"row2":""}"><div><span class="lb">${min?"Minutes":"Reps"}</span><input inputmode="${min?"decimal":"numeric"}" placeholder="${l?l[1].v:e.u}" value="${esc(String(c.v||""))}" data-dv="${i}" data-df="v"></div>`;
    if(e.as)h+=`<div><span class="lb">Assist (kg)</span><input inputmode="decimal" placeholder="${l&&l[1].a?l[1].a:"0 = none"}" value="${esc(String(c.a===undefined?"":c.a))}" data-dv="${i}" data-df="a"></div>`;
    h+="</div></div>";
  });
  const ds=Object.keys(S.daily).filter(d=>DAILY.some(e=>S.daily[d][e.n]&&S.daily[d][e.n].v)).sort().reverse().slice(0,7);
  if(ds.length)h+='<div class="card"><h3>Recent days</h3><table class="tbl">'+ds.map(d=>`<tr><td>${d}</td><td>${DAILY.filter(e=>S.daily[d][e.n]&&S.daily[d][e.n].v).map(e=>e.n+" "+fmt(S.daily[d][e.n],e)).join(" · ")}</td></tr>`).join("")+"</table></div>";
  $("app").innerHTML=h;
}
function render(){$("vT").classList.toggle("on",view==="t");$("vD").classList.toggle("on",view==="d");$("vH").classList.toggle("on",view==="h");view==="t"?renderT():view==="d"?renderD():renderH()}

document.addEventListener("click",e=>{
  const t=e.target;
  if(t.id==="vT"){view="t";render()}
  else if(t.id==="vD"){view="d";render()}
  else if(t.id==="vH"){view="h";render()}
  else if(t.dataset.d!==undefined){S.day=+t.dataset.d;save();render()}
  else if(t.dataset.add!==undefined){sets(S.day,PLAN[S.day].ex[+t.dataset.add]).push(["",11]);save();render()}
  else if(t.id==="clr"){if(confirm("Clear today's entries?")){delete S.draft[S.day];save();render()}}
  else if(t.id==="fin"){
    const d=S.day,e2={};
    PLAN[d].ex.forEach(ex=>{
      const v=sets(d,ex).map(s=>[parseFloat(String(s[0]).replace(",",".")),parseInt(s[1])]).filter(s=>s[0]>=0&&s[1]>0);
      if(v.length)e2[ex]=v;
    });
    if(!Object.keys(e2).length){alert("Enter at least one set first.");return}
    S.sessions.push({date:today(),day:d,n:PLAN[d].n,e:e2});
    delete S.draft[d];save();view="h";render();
  }
  else if(t.id==="exp"){
    const j=JSON.stringify({sessions:S.sessions,notes:S.notes,daily:S.daily});
    (navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>{t.textContent="Copied"},()=>{t.textContent="Copy failed"});
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.dv!==undefined){const D=(S.daily[today()]=S.daily[today()]||{}),k=DAILY[+t.dataset.dv].n;(D[k]=D[k]||{})[t.dataset.df]=t.value;save()}
  else if(t.dataset.n!==undefined){S.notes[PLAN[S.day].ex[+t.dataset.n]]=t.value;save()}
  else if(t.dataset.f!==undefined){sets(S.day,PLAN[S.day].ex[+t.dataset.e])[+t.dataset.s][+t.dataset.f]=t.value;save()}
});
render();
</script>
</body>
